{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:400px;">
  <h2>Log in</h2>
  <form method="POST">
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit">Log in</button>
  </form>
  <p style="font-size:0.85rem; color:#9fb3c8;">No account yet? <a href="{{ url_for('signup') }}" style="color:#3462ff;">Sign up</a></p>
</div>
{% endblock %}
