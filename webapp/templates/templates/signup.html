{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:400px;">
  <h2>Sign up</h2>
  <form method="POST">
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Password (min 8 characters)</label>
    <input type="password" name="password" required minlength="8">
    <button type="submit">Create account</button>
  </form>
  <p style="font-size:0.85rem; color:#9fb3c8;">Already have an account? <a href="{{ url_for('login') }}" style="color:#3462ff;">Log in</a></p>
</div>
{% endblock %}
